[workspace]
members = [
    "bls12-381-syscall",
    "callback",
    "compute-budget",
    "feature-set",
    "log-collector",
    "measure",
    "program-binaries",
    "program-runtime",
    "programs/bpf_loader",
    "programs/compute-budget",
    "programs/loader-v4",
    "programs/system",
    "svm",
    "svm-test-harness",
    "svm-test-harness/fixture",
    "svm-test-harness/instr",
    "syscalls",
    "timings",
    "transaction",
    "transaction-context",
    "type-overrides",
]

exclude = ["programs/sbf", "svm/tests/example-programs"]

resolver = "2"

[workspace.package]
version = "4.1.0-alpha.0"
description = "Solana SVM"
authors = ["Anza Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/anza-xyz/svm"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
edition = "2021"

[workspace.lints.rust]
# List of rust-2024-compatibility lints that are already satisfied
# See https://doc.rust-lang.org/rustc/lints/groups.html
boxed_slice_into_iter = "deny"
dependency_on_unit_never_type_fallback = "deny"
deprecated_safe_2024 = "deny"
impl_trait_overcaptures = "deny"
missing_unsafe_on_extern = "deny"
never_type_fallback_flowing_into_unsafe = "deny"
rust_2024_guarded_string_incompatible_syntax = "deny"
rust_2024_incompatible_pat = "deny"
rust_2024_prelude_collisions = "deny"
static_mut_refs = "deny"
unsafe_attr_outside_unsafe = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("frozen-abi", "no-entrypoint"))',
    'cfg(target_arch, values("sbf"))',
]

# Clippy lint configuration that can not be applied in clippy.toml
[workspace.lints.clippy]
arithmetic_side_effects = "deny"
default_trait_access = "deny"
manual_let_else = "deny"
used_underscore_binding = "deny"

[workspace.dependencies]
agave-feature-set = { git = "https://github.com/anza-xyz/agave", rev = "153f52c849", features = ["agave-unstable-api"] }
agave-precompiles = { git = "https://github.com/anza-xyz/agave", rev = "153f52c849", features = ["agave-unstable-api"] }
ahash = "0.8.12"
assert_matches = "1.5.0"
base64 = "0.22.1"
bincode = "1.3.3"
blst = "0.3.16"
blstrs = "0.7.1"
bytemuck = "1.25.0"
bytemuck_derive = "1.10.2"
cfg-if = "1.0.4"
criterion = "0.8.2"
eager = "0.1.0"
enum-iterator = "2.3.0"
env_logger = "0.11.10"
futures = "0.3.32"
group = "0.13.0"
hex-literal = "1.1.0"
itertools = "0.14.0"
libsecp256k1 = { version = "0.7.2", default-features = false, features = [
    "std",
    "static-context",
] }
log = "0.4.29"
num-traits = "0.2"
openssl = "0.10"
pairing = "0.23.0"
percentage = "0.1.0"
prost = "0.11.9"
prost-build = "0.11.9"
protosol = "2.0.0"
qualifier_attr = { version = "0.2.2", default-features = false }
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
shuttle = "0.7.1"
