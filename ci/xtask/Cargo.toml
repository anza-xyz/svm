[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

# Prevents auto-detection of parent workspace
[workspace]

[features]
dummy-for-ci-check = []
frozen-abi = []

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.23"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3.23"
